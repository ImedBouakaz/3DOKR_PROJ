services:
  web-vote:
    container_name: web-vote
    image: imedbouakaz/vote_app
    ports:
      - "8082:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - backend

  web-result:
    container_name: web-result
    image: imedbouakaz/result_app
    ports:
      - "8081:8888"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      
    depends_on:
      - postgres
    networks:
      - backend

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - backend

  postgres:
    image: postgres:14.5
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - backend

  worker:
    image: imedbouakaz/worker_app
    depends_on:
      - redis
      - postgres
    networks:
      - backend


volumes:
  postgres_data:
networks:
  backend:
    driver: overlay
